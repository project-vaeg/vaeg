name: release

on:
  push:
    tags:
      - 'rel-*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Existing rel-* tag to package'
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}

jobs:
  linux:
    name: linux gcc release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref }}
          fetch-depth: 0
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libsdl2-dev libarchive-dev \
            libgl1-mesa-dev gcc g++ nasm
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Configure
        run: cmake --preset linux-ci-gcc -DVAEG_ENABLE_LIBRASHADER=ON
      - name: Build
        run: cmake --build --preset linux-ci-gcc
      - name: Smoke
        run: SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy ./build/linux-ci-gcc/sdl2/vaeg --smoke
      - name: Unit tests
        run: ctest --test-dir build/linux-ci-gcc --output-on-failure
      - name: Build PC-88VA guest-driver bundle
        run: >-
          tools/pc88va/build-guest-driver-bundle.sh
          --output build/pc88va-guest-drivers
          --hostfat build/linux-ci-gcc/guest/hostfat.sys
      - name: Upload PC-88VA guest-driver bundle
        uses: actions/upload-artifact@v4
        with:
          name: vaeg-release-pc88va-guest-drivers
          path: build/pc88va-guest-drivers/
      - name: Package
        run: |
          set -euo pipefail
          release_id="${RELEASE_TAG//-/}"
          release_notes="CHANGES.${RELEASE_TAG#rel-}.md"
          package="vaeg-${release_id}-linux-x86_64"
          asset="${package}.tar.gz"
          test -f "${release_notes}"
          rm -rf dist-package "${asset}"
          mkdir -p "dist-package/${package}/assets" \
            "dist-package/${package}/licenses" \
            "dist-package/${package}/shaders/crt/licenses"
          install -m 755 build/linux-ci-gcc/sdl2/vaeg "dist-package/${package}/vaeg"
          tools/release/build-librashader-runtime.sh linux \
            "dist-package/${package}"
          cp -R build/pc88va-guest-drivers/. "dist-package/${package}/"
          install -m 644 assets/OFL.txt "dist-package/${package}/assets/"
          install -m 644 assets/NOTICE.md "dist-package/${package}/assets/"
          install -m 644 external/suzukiplan-z80/LICENSE.txt \
            "dist-package/${package}/licenses/suzukiplan-z80.txt"
          install -m 644 third_party/librashader/license-mpl-2.0.txt \
            "dist-package/${package}/licenses/LIBRASHADER_MPL-2.0.txt"
          install -m 644 third_party/librashader/readme.vaeg.md \
            "dist-package/${package}/licenses/LIBRASHADER_SOURCE.txt"
          install -m 644 assets/NOTICE.md \
            "dist-package/${package}/licenses/THIRD_PARTY_NOTICES.md"
          install -m 644 assets/shaders/crt/vaeg_crt_lottes_fast.slangp \
            "dist-package/${package}/shaders/crt/"
          install -m 644 assets/shaders/crt/shaders/crt-lottes-fast.slang \
            "dist-package/${package}/shaders/crt/"
          install -m 644 assets/shaders/crt/licenses/crt_lottes_fast_unlicense.txt \
            "dist-package/${package}/shaders/crt/licenses/CRT_LOTTES_FAST_LICENSE.txt"
          install -m 644 assets/shaders/crt/licenses/crt_lottes_fast_provenance.md \
            "dist-package/${package}/shaders/crt/licenses/CRT_LOTTES_FAST_PROVENANCE.md"
          install -m 644 "${release_notes}" "dist-package/${package}/"
          install -m 644 dist/readme-dist.txt "dist-package/${package}/README-dist.txt"
          tar -C dist-package -czf "${asset}" "${package}"
          tar -tzf "${asset}"
          python3 tests/z80_compat/check_zex_archive.py "${asset}"
          python3 tools/release/inspect-librashader-package.py \
            "${asset}" --platform linux
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_notes="CHANGES.${RELEASE_TAG#rel-}.md"
          test -f "${release_notes}"
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            release_title="88VA Eternal Grafx Rel.${RELEASE_TAG#rel-}"
            gh release edit "${RELEASE_TAG}" \
              --title "${release_title}" \
              --notes-file "${release_notes}"
          else
            release_title="88VA Eternal Grafx Rel.${RELEASE_TAG#rel-}"
            gh release create "${RELEASE_TAG}" \
              --verify-tag \
              --title "${release_title}" \
              --notes-file "${release_notes}"
          fi
      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_id="${RELEASE_TAG//-/}"
          gh release upload "${RELEASE_TAG}" \
            "vaeg-${release_id}-linux-x86_64.tar.gz" \
            --clobber

  windows:
    name: windows mingw native static-runtime
    runs-on: windows-latest
    needs: linux
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref }}
          fetch-depth: 0
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            nasm
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Expose Rust to MSYS2
        shell: msys2 {0}
        run: |
          echo "PATH=$(cygpath -u \"${USERPROFILE}\")/.cargo/bin:$PATH" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake --preset mingw-ci -DVAEG_ENABLE_LIBRASHADER=ON
      - name: Build
        run: cmake --build --preset mingw-ci
      - name: Smoke
        run: SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy ./build/mingw-ci/sdl2/vaeg.exe --smoke
      - name: Unit tests
        run: |
          set +e
          ctest --test-dir build/mingw-ci --output-on-failure 2>&1 | tee ctest.log
          status=${PIPESTATUS[0]}
          if [ "${status}" -ne 0 ]; then
            failed_tests="$(cat build/mingw-ci/Testing/Temporary/LastTestsFailed.log 2>/dev/null | tr '\n' ' ')"
            if [ -z "${failed_tests}" ]; then
              failed_tests="$(grep -E '\*\*\*Failed' ctest.log | tr '\n' ' ')"
            fi
            echo "CTest failed tests: ${failed_tests}" >&2
            failure_markers="$(grep -E 'FAIL|failed|CMake Error|Error:' ctest.log | tr '\r\n' ' ')"
            echo "CTest failure markers: ${failure_markers}" >&2
            echo "::error title=CTest failure markers::${failure_markers}"
            failed_names="$(sed -n 's/^[0-9][0-9]*:\([^ ]*\).*/\1/p' build/mingw-ci/Testing/Temporary/LastTestsFailed.log 2>/dev/null)"
            for failed_name in ${failed_names}; do
              start_line="$(grep -n "Start .*: ${failed_name}" ctest.log | head -n 1 | cut -d: -f1)"
              if [ -n "${start_line}" ]; then
                end_line=$((start_line + 80))
                failed_section="$(sed -n "${start_line},${end_line}p" ctest.log | tail -n 80 | tr '\r\n' ' ')"
                failed_section="${failed_section//%/%25}"
                failed_section="${failed_section//$'\r'/}"
                echo "CTest failed test output: ${failed_section}" >&2
                echo "::error title=CTest failed test output::${failed_section}"
              fi
            done
          fi
          exit "${status}"
      - name: Download PC-88VA guest-driver bundle
        uses: actions/download-artifact@v4
        with:
          name: vaeg-release-pc88va-guest-drivers
          path: build/pc88va-guest-drivers
      - name: Verify PC-88VA guest-driver bundle
        run: |
          cd build/pc88va-guest-drivers
          sha256sum --check SHA256SUMS
      - name: Verify Windows runtime imports
        run: |
          set -euo pipefail
          objdump -p build/mingw-ci/sdl2/vaeg.exe |
            awk '/DLL Name:/ {print $3}' | tee imports.txt
          if grep -E 'SDL2\.dll|libgcc_s_seh-1\.dll|libstdc\+\+-6\.dll|libwinpthread-1\.dll' imports.txt; then
            echo "unexpected SDL2 or MinGW runtime DLL import" >&2
            exit 1
          fi
          bad=0
          while IFS= read -r dll; do
            lower="$(printf '%s' "${dll}" | tr '[:upper:]' '[:lower:]')"
            case "${lower}" in
              kernel32.dll|msvcrt.dll|user32.dll|gdi32.dll|advapi32.dll|shell32.dll|ole32.dll|oleaut32.dll|imm32.dll|version.dll|winmm.dll|setupapi.dll|uuid.dll|ws2_32.dll|bcrypt.dll|crypt32.dll|comdlg32.dll|comctl32.dll|shlwapi.dll|rpcrt4.dll|dwmapi.dll|hid.dll|cfgmgr32.dll|librashader.dll|api-ms-win-*.dll|ext-ms-*.dll)
                ;;
              *)
                echo "unexpected non-system DLL import: ${dll}" >&2
                bad=1
                ;;
            esac
          done < imports.txt
          exit "${bad}"
      - name: Stage package
        run: |
          set -euo pipefail
          release_id="${RELEASE_TAG//-/}"
          release_notes="CHANGES.${RELEASE_TAG#rel-}.md"
          package="vaeg-${release_id}-win-x86_64"
          test -f "${release_notes}"
          rm -rf dist-package
          mkdir -p "dist-package/${package}/assets" "dist-package/${package}/licenses" \
            "dist-package/${package}/shaders/crt/licenses"
          cp build/mingw-ci/sdl2/vaeg.exe "dist-package/${package}/"
          tools/release/build-librashader-runtime.sh windows \
            "dist-package/${package}"
          cp -R build/pc88va-guest-drivers/. "dist-package/${package}/"
          cp assets/OFL.txt "dist-package/${package}/assets/"
          cp assets/NOTICE.md "dist-package/${package}/assets/"
          cp external/suzukiplan-z80/LICENSE.txt \
            "dist-package/${package}/licenses/suzukiplan-z80.txt"
          cp third_party/librashader/license-mpl-2.0.txt \
            "dist-package/${package}/licenses/LIBRASHADER_MPL-2.0.txt"
          cp third_party/librashader/readme.vaeg.md \
            "dist-package/${package}/licenses/LIBRASHADER_SOURCE.txt"
          cp assets/NOTICE.md \
            "dist-package/${package}/licenses/THIRD_PARTY_NOTICES.md"
          cp assets/shaders/crt/vaeg_crt_lottes_fast.slangp \
            "dist-package/${package}/shaders/crt/"
          cp assets/shaders/crt/shaders/crt-lottes-fast.slang \
            "dist-package/${package}/shaders/crt/"
          cp assets/shaders/crt/licenses/crt_lottes_fast_unlicense.txt \
            "dist-package/${package}/shaders/crt/licenses/CRT_LOTTES_FAST_LICENSE.txt"
          cp assets/shaders/crt/licenses/crt_lottes_fast_provenance.md \
            "dist-package/${package}/shaders/crt/licenses/CRT_LOTTES_FAST_PROVENANCE.md"
          cp "${release_notes}" "dist-package/${package}/"
          cp dist/readme-dist.txt "dist-package/${package}/README-dist.txt"
          find "dist-package/${package}" -type f | sort
      - name: Zip package
        shell: pwsh
        run: |
          $releaseId = $env:RELEASE_TAG -replace '-', ''
          $package = "vaeg-$releaseId-win-x86_64"
          $asset = "$package.zip"
          if (Test-Path $asset) {
            Remove-Item $asset
          }
          Compress-Archive -Path "dist-package/$package" -DestinationPath $asset -Force
          python tests/z80_compat/check_zex_archive.py $asset
          python tools/release/inspect-librashader-package.py $asset --platform windows
      - name: Upload release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseId = $env:RELEASE_TAG -replace '-', ''
          gh release upload $env:RELEASE_TAG "vaeg-$releaseId-win-x86_64.zip" --clobber

  macos:
    name: macos fetch-sdl2 release
    runs-on: macos-14
    needs: linux
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref }}
          fetch-depth: 0
      - name: Install build tools
        run: brew install cmake ninja nasm
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Configure
        run: cmake --preset macos-ci -DVAEG_ENABLE_LIBRASHADER=ON
      - name: Build
        run: cmake --build --preset macos-ci
      - name: Smoke
        run: SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy ./build/macos-ci/sdl2/vaeg --smoke
      - name: Unit tests
        run: ctest --test-dir build/macos-ci --output-on-failure
      - name: Download PC-88VA guest-driver bundle
        uses: actions/download-artifact@v4
        with:
          name: vaeg-release-pc88va-guest-drivers
          path: build/pc88va-guest-drivers
      - name: Verify PC-88VA guest-driver bundle
        run: |
          cd build/pc88va-guest-drivers
          shasum -a 256 --check SHA256SUMS
      - name: Package
        run: |
          set -euo pipefail
          file build/macos-ci/sdl2/vaeg | tee vaeg-file.txt
          grep -q 'arm64' vaeg-file.txt
          release_id="${RELEASE_TAG//-/}"
          release_notes="CHANGES.${RELEASE_TAG#rel-}.md"
          package="vaeg-${release_id}-macos-arm64"
          asset="${package}.tar.gz"
          test -f "${release_notes}"
          rm -rf dist-package "${asset}"
          mkdir -p "dist-package/${package}/assets" \
            "dist-package/${package}/licenses" \
            "dist-package/${package}/shaders/crt/licenses"
          install -m 755 build/macos-ci/sdl2/vaeg "dist-package/${package}/vaeg"
          tools/release/build-librashader-runtime.sh macos \
            "dist-package/${package}"
          cp -R build/pc88va-guest-drivers/. "dist-package/${package}/"
          install -m 644 assets/OFL.txt "dist-package/${package}/assets/"
          install -m 644 assets/NOTICE.md "dist-package/${package}/assets/"
          install -m 644 external/suzukiplan-z80/LICENSE.txt \
            "dist-package/${package}/licenses/suzukiplan-z80.txt"
          install -m 644 third_party/librashader/license-mpl-2.0.txt \
            "dist-package/${package}/licenses/LIBRASHADER_MPL-2.0.txt"
          install -m 644 third_party/librashader/readme.vaeg.md \
            "dist-package/${package}/licenses/LIBRASHADER_SOURCE.txt"
          install -m 644 assets/NOTICE.md \
            "dist-package/${package}/licenses/THIRD_PARTY_NOTICES.md"
          install -m 644 assets/shaders/crt/vaeg_crt_lottes_fast.slangp \
            "dist-package/${package}/shaders/crt/"
          install -m 644 assets/shaders/crt/shaders/crt-lottes-fast.slang \
            "dist-package/${package}/shaders/crt/"
          install -m 644 assets/shaders/crt/licenses/crt_lottes_fast_unlicense.txt \
            "dist-package/${package}/shaders/crt/licenses/CRT_LOTTES_FAST_LICENSE.txt"
          install -m 644 assets/shaders/crt/licenses/crt_lottes_fast_provenance.md \
            "dist-package/${package}/shaders/crt/licenses/CRT_LOTTES_FAST_PROVENANCE.md"
          install -m 644 "${release_notes}" "dist-package/${package}/"
          install -m 644 dist/readme-dist.txt "dist-package/${package}/README-dist.txt"

          if otool -L "dist-package/${package}/vaeg" | grep -E 'libSDL2.*dylib'; then
            echo "unexpected dynamic SDL2 dependency" >&2
            exit 1
          fi

          otool -L "dist-package/${package}/vaeg"
          find "dist-package/${package}" -type f | sort
          tar -C dist-package -czf "${asset}" "${package}"
          tar -tzf "${asset}"
          python3 tests/z80_compat/check_zex_archive.py "${asset}"
          python3 tools/release/inspect-librashader-package.py \
            "${asset}" --platform macos
      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_id="${RELEASE_TAG//-/}"
          gh release upload "${RELEASE_TAG}" \
            "vaeg-${release_id}-macos-arm64.tar.gz" \
            --clobber
